baseURL: https://example.org/
locale: en-us
title: Chudo
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Chudo
  keywords: [Daniel Chudnovski, Chudnovski, Chudo, Blog]
  # images: ["<link or path of image for opengraph, twitter-cards>"]
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: true

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    # favicon: "<link / abs url>"
    # favicon16x16: "<link / abs url>"
    # favicon32x32: "<link / abs url>"
    # apple_touch_icon: "<link / abs url>"
    # safari_pinned_tab: "<link / abs url>"

  label:
    text: "Chudo"
    # icon: /apple-touch-icon.png
    # iconHeight: 35

  socialIcons:
    - name: instagram
      url: "https://instagram.com/daniel_chudo"
    - name: linkedin
      url: "https://linkedin.com/in/daniel-chudnovski"
    - name: github
      url: "https://github.com/DanielChudo"

  cover:
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # editPost:
  #   URL: "https://github.com/<path_to_repo>/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  # fuseOpts:
  #   isCaseSensitive: false
  #   shouldSort: true
  #   location: 0
  #   distance: 1000
  #   threshold: 0.4
  #   minMatchCharLength: 0
  #   limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
  #   keys: ["title", "permalink", "summary", "content"]

# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    lineNos: true
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # style: monokai

defaultContentLanguage: en
defaultContentLanguageInSubdir: true

languages:
  en:
    languageName: English
    languageDirection: ltr
    weight: 1
    params:
      author: "Daniel Chudnovski"
      description: "👋 Hi, I'm Daniel Chudnovski, a software engineer who is aware of both the benefits and dangers of technology"
      DateFormat: "January 2, 2006"
      displayFullLangName: true
      homeInfoParams:
        Title: "👋 Hi, I'm Daniel Chudnovski"
        Content: "A software engineer who is aware of both the benefits and dangers of technology"
  ru:
    languageName: Русский
    languageDirection: ltr
    weight: 2
    params:
      author: "Даниэль Чудновский"
      description: "👋 Привет, Я Даниэль Чудновский — программист, осознающий как преимущества, так и опасности технологий"
      DateFormat: "2 January 2006"
      displayFullLangName: true
      homeInfoParams:
        Title: "👋 Привет, Я Даниэль Чудновский"
        Content: "Программист, осознающий как преимущества, так и опасности технологий"
  he:
    languageName: עברית
    languageDirection: rtl
    weight: 3
    params:
      author: "דניאל צ'ודנובסקי"
      description: "👋 שלום, אני דניאל צ'ודנובסקי — מתכנת שמודע גם ליתרונות וגם לסכנות של טכנולוגיות"
      DateFormat: "2 January 2006"
      displayFullLangName: true
      homeInfoParams:
        Title: "👋 שלום, אני דניאל צ'ודנובסקי"
        Content: "מתכנת שמודע גם ליתרונות וגם לסכנות של טכנולוגיות"

permalinks:
  posts: "/:slug/"
